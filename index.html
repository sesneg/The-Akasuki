<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library & Resource Management</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        margin: 0;
        color: #222;
    }
    header {
        background: #1f4e79;
        color: white;
        padding: 16px 24px;
    }
    header h1 {
        margin: 0;
        font-size: 20px;
    }
    header p {
        margin: 4px 0 0 0;
        font-size: 13px;
        color: #cfe0f0;
    }
    nav {
        display: flex;
        background: white;
        border-bottom: 2px solid #1f4e79;
    }
    nav button {
        flex: 1;
        padding: 12px;
        border: none;
        background: white;
        cursor: pointer;
        font-size: 14px;
        border-right: 1px solid #ddd;
    }
    nav button.active {
        background: #1f4e79;
        color: white;
    }
    main {
        max-width: 900px;
        margin: 20px auto;
        padding: 0 16px;
    }
    .panel {
        display: none;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .panel.active {
        display: block;
    }
    label {
        display: block;
        font-size: 13px;
        margin-top: 10px;
        margin-bottom: 3px;
        color: #444;
    }
    input, select {
        width: 100%;
        padding: 6px;
        border: 1px solid #bbb;
        border-radius: 3px;
        font-size: 14px;
    }
    button.action {
        margin-top: 14px;
        background: #1f4e79;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 14px;
    }
    button.action:hover {
        background: #163a5c;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
        font-size: 13px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 6px 8px;
        text-align: left;
    }
    th {
        background: #eef3f8;
    }
    .status-AVAILABLE { color: #1a7a1a; font-weight: bold; }
    .status-LOANED_OUT, .status-OCCUPIED { color: #b5860a; font-weight: bold; }
    .status-UNDER_MAINTENANCE { color: #b5390a; font-weight: bold; }
    .status-DISPOSED { color: #777; font-weight: bold; }
    #message {
        margin-top: 10px;
        font-size: 13px;
    }
    .msg-ok { color: #1a7a1a; }
    .msg-error { color: #b5390a; }
    .two-col {
        display: flex;
        gap: 12px;
    }
    .two-col > div {
        flex: 1;
    }
</style>
</head>
<body>

<header>
    <h1>Library & Resource Management System</h1>
    <p>Ministry of Higher Education, Training and Innovations — connects to the API at http://localhost:8080/library</p>
</header>

<nav>
    <button class="tab-btn active" data-tab="view">Global View</button>
    <button class="tab-btn" data-tab="campus">Campus View</button>
    <button class="tab-btn" data-tab="overdue">Overdue</button>
    <button class="tab-btn" data-tab="add">Add Asset</button>
    <button class="tab-btn" data-tab="loan">Loan / Book</button>
    <button class="tab-btn" data-tab="schedule">Schedules</button>
    <button class="tab-btn" data-tab="institutions">Institutions</button>
    <button class="tab-btn" data-tab="components">Components</button>
    <button class="tab-btn" data-tab="workorders">Work Orders</button>
</nav>

<main>

    <div id="message"></div>

    <!-- GLOBAL VIEW -->
    <div class="panel active" id="panel-view">
        <button class="action" onclick="loadAllAssets()">Refresh list</button>
        <table id="table-view">
            <thead>
                <tr><th>Asset Tag</th><th>Name</th><th>Institution</th><th>Site</th><th>Status</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- CAMPUS VIEW -->
    <div class="panel" id="panel-campus">
        <label for="campus-institution">Institution</label>
        <input id="campus-institution" placeholder="e.g. Namibia University of Science and Technology">
        <label for="campus-site">Site (optional)</label>
        <input id="campus-site" placeholder="e.g. Main Campus - Innovation Lab">
        <button class="action" onclick="loadByCampus()">Filter</button>
        <table id="table-campus">
            <thead>
                <tr><th>Asset Tag</th><th>Name</th><th>Site</th><th>Status</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- OVERDUE -->
    <div class="panel" id="panel-overdue">
        <button class="action" onclick="loadOverdue()">Check overdue items</button>
        <table id="table-overdue">
            <thead>
                <tr><th>Asset Tag</th><th>Name</th><th>Schedule</th><th>Due Date</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- ADD ASSET -->
    <div class="panel" id="panel-add">
        <div class="two-col">
            <div>
                <label for="add-tag">Asset Tag</label>
                <input id="add-tag" placeholder="NUST-LIB-3DP-001">
                <label for="add-name">Name</label>
                <input id="add-name">
                <label for="add-desc">Description</label>
                <input id="add-desc">
                <label for="add-institution">Institution</label>
                <input id="add-institution">
            </div>
            <div>
                <label for="add-site">Site</label>
                <input id="add-site">
                <label for="add-date">Date Acquired</label>
                <input id="add-date" type="date">
                <label for="add-status">Status</label>
                <select id="add-status">
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="OCCUPIED">OCCUPIED</option>
                    <option value="UNDER_MAINTENANCE">UNDER_MAINTENANCE</option>
                    <option value="DISPOSED">DISPOSED</option>
                </select>
            </div>
        </div>
        <button class="action" onclick="addAsset()">Register asset</button>
    </div>

    <!-- LOAN / BOOK -->
    <div class="panel" id="panel-loan">
        <label for="loan-tag">Asset Tag</label>
        <input id="loan-tag">
        <label for="loan-borrower">Borrower</label>
        <input id="loan-borrower">
        <label for="loan-due">Due Date</label>
        <input id="loan-due" type="date">
        <button class="action" onclick="loanAsset()">Loan / Book</button>
        <button class="action" onclick="returnAsset()" style="background:#666; margin-left:8px;">Return asset</button>
    </div>

    <!-- SCHEDULES -->
    <div class="panel" id="panel-schedule">
        <label for="sch-tag">Asset Tag</label>
        <input id="sch-tag">
        <label for="sch-id">Schedule ID</label>
        <input id="sch-id" placeholder="SCH-001">
        <label for="sch-type">Type</label>
        <select id="sch-type">
            <option value="MAINTENANCE">MAINTENANCE</option>
            <option value="BOOKING">BOOKING</option>
            <option value="SERVICE">SERVICE</option>
        </select>
        <label for="sch-due">Due Date</label>
        <input id="sch-due" type="date">
        <label for="sch-desc">Description</label>
        <input id="sch-desc">
        <button class="action" onclick="addSchedule()">Add schedule</button>
    </div>

    <!-- INSTITUTIONS -->
    <div class="panel" id="panel-institutions">
        <button class="action" onclick="loadInstitutions()">Refresh list</button>
        <table id="table-institutions">
            <thead>
                <tr><th>Institution</th><th>Sites</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <hr style="margin: 16px 0;">
        <div class="two-col">
            <div>
                <label for="inst-name">Institution name</label>
                <input id="inst-name">
                <label for="inst-sites">Sites (comma separated)</label>
                <input id="inst-sites" placeholder="Main Campus, North Campus">
                <button class="action" onclick="addInstitution()">Add institution</button>
            </div>
            <div>
                <label for="inst-remove">Institution to remove</label>
                <input id="inst-remove">
                <button class="action" onclick="removeInstitution()" style="background:#a33;">Remove</button>
            </div>
        </div>
    </div>

    <!-- COMPONENTS -->
    <div class="panel" id="panel-components">
        <label for="comp-tag">Asset Tag</label>
        <input id="comp-tag">
        <label for="comp-id">Component ID</label>
        <input id="comp-id" placeholder="C101">
        <label for="comp-name">Name</label>
        <input id="comp-name">
        <label for="comp-desc">Description</label>
        <input id="comp-desc">
        <button class="action" onclick="addComponent()">Add component</button>
        <button class="action" onclick="removeComponent()" style="background:#a33; margin-left:8px;">Remove component (by ID)</button>
    </div>

    <!-- WORK ORDERS -->
    <div class="panel" id="panel-workorders">
        <label for="wo-tag">Asset Tag</label>
        <input id="wo-tag">
        <label for="wo-id">Work Order ID</label>
        <input id="wo-id" placeholder="WO-554">
        <label for="wo-desc">Description</label>
        <input id="wo-desc">
        <button class="action" onclick="addWorkOrder()">Open work order</button>

        <hr style="margin: 16px 0;">

        <label for="wo-status-id">Work Order ID to update</label>
        <input id="wo-status-id">
        <label for="wo-status">New status</label>
        <select id="wo-status">
            <option value="OPEN">OPEN</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="CLOSED">CLOSED</option>
        </select>
        <button class="action" onclick="updateWorkOrderStatus()">Update status</button>

        <hr style="margin: 16px 0;">

        <label for="task-wo-id">Work Order ID</label>
        <input id="task-wo-id">
        <label for="task-id">Task ID</label>
        <input id="task-id" placeholder="T1">
        <label for="task-desc">Task description</label>
        <input id="task-desc">
        <button class="action" onclick="addTask()">Add task</button>
    </div>

</main>

<script>
const API = "http://localhost:8080/library";

// tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
});

function showMessage(text, isError) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = isError ? "msg-error" : "msg-ok";
}

// ---- Global view ----
async function loadAllAssets() {
    try {
        const res = await fetch(API + "/assets");
        const assets = await res.json();
        const tbody = document.querySelector("#table-view tbody");
        tbody.innerHTML = "";
        assets.forEach(a => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${a.assetTag}</td><td>${a.name}</td><td>${a.institution}</td>
                <td>${a.site}</td><td class="status-${a.status}">${a.status}</td>`;
            tbody.appendChild(row);
        });
        showMessage(assets.length + " asset(s) loaded.", false);
    } catch (err) {
        showMessage("Could not reach the API. Is the service running on port 8080?", true);
    }
}

// ---- Campus view ----
async function loadByCampus() {
    const institution = document.getElementById("campus-institution").value.trim();
    const site = document.getElementById("campus-site").value.trim();
    if (institution === "") {
        showMessage("Enter an institution name first.", true);
        return;
    }
    let url = API + "/assets/institution/" + encodeURIComponent(institution);
    if (site !== "") {
        url += "?site=" + encodeURIComponent(site);
    }
    try {
        const res = await fetch(url);
        const assets = await res.json();
        const tbody = document.querySelector("#table-campus tbody");
        tbody.innerHTML = "";
        assets.forEach(a => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${a.assetTag}</td><td>${a.name}</td><td>${a.site}</td>
                <td class="status-${a.status}">${a.status}</td>`;
            tbody.appendChild(row);
        });
        showMessage(assets.length + " asset(s) found.", false);
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Overdue ----
async function loadOverdue() {
    try {
        const res = await fetch(API + "/assets/overdue");
        const assets = await res.json();
        const tbody = document.querySelector("#table-overdue tbody");
        tbody.innerHTML = "";
        assets.forEach(a => {
            a.schedules.forEach(s => {
                const row = document.createElement("tr");
                row.innerHTML = `<td>${a.assetTag}</td><td>${a.name}</td><td>${s.scheduleId} (${s.type})</td><td>${s.dueDate}</td>`;
                tbody.appendChild(row);
            });
        });
        showMessage(assets.length + " overdue asset(s).", false);
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Add asset ----
async function addAsset() {
    const body = {
        assetTag: document.getElementById("add-tag").value.trim(),
        name: document.getElementById("add-name").value.trim(),
        description: document.getElementById("add-desc").value.trim(),
        institution: document.getElementById("add-institution").value.trim(),
        site: document.getElementById("add-site").value.trim(),
        dateAcquired: document.getElementById("add-date").value,
        status: document.getElementById("add-status").value
    };
    if (body.assetTag === "" || body.name === "") {
        showMessage("Asset Tag and Name are required.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (res.ok) {
            showMessage("Asset " + body.assetTag + " registered.", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Loan / return ----
async function loanAsset() {
    const tag = document.getElementById("loan-tag").value.trim();
    const borrower = document.getElementById("loan-borrower").value.trim();
    const due = document.getElementById("loan-due").value;
    if (tag === "" || borrower === "" || due === "") {
        showMessage("Fill in asset tag, borrower and due date.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/loan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ borrower: borrower, dueDate: due })
        });
        if (res.ok) {
            showMessage("Loaned " + tag + " to " + borrower + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

async function returnAsset() {
    const tag = document.getElementById("loan-tag").value.trim();
    if (tag === "") {
        showMessage("Enter the asset tag first.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/returnAsset", { method: "POST" });
        if (res.ok) {
            showMessage(tag + " returned.", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Schedules ----
async function addSchedule() {
    const tag = document.getElementById("sch-tag").value.trim();
    const body = {
        scheduleId: document.getElementById("sch-id").value.trim(),
        type: document.getElementById("sch-type").value,
        dueDate: document.getElementById("sch-due").value,
        description: document.getElementById("sch-desc").value.trim()
    };
    if (tag === "" || body.scheduleId === "" || body.dueDate === "") {
        showMessage("Fill in asset tag, schedule id and due date.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/schedules", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (res.ok) {
            showMessage("Schedule added to " + tag + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Institutions ----
async function loadInstitutions() {
    try {
        const res = await fetch(API + "/institutions");
        const list = await res.json();
        const tbody = document.querySelector("#table-institutions tbody");
        tbody.innerHTML = "";
        list.forEach(inst => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${inst.name}</td><td>${inst.sites.join(", ")}</td>`;
            tbody.appendChild(row);
        });
        showMessage(list.length + " institution(s) loaded.", false);
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

async function addInstitution() {
    const name = document.getElementById("inst-name").value.trim();
    const sitesRaw = document.getElementById("inst-sites").value.trim();
    if (name === "") {
        showMessage("Enter an institution name.", true);
        return;
    }
    const sites = sitesRaw === "" ? [] : sitesRaw.split(",").map(s => s.trim());
    try {
        const res = await fetch(API + "/institutions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, sites: sites })
        });
        if (res.ok) {
            showMessage("Institution " + name + " added.", false);
            loadInstitutions();
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

async function removeInstitution() {
    const name = document.getElementById("inst-remove").value.trim();
    if (name === "") {
        showMessage("Enter an institution name to remove.", true);
        return;
    }
    try {
        const res = await fetch(API + "/institutions/" + encodeURIComponent(name), { method: "DELETE" });
        if (res.ok) {
            showMessage("Institution " + name + " removed.", false);
            loadInstitutions();
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Components ----
async function addComponent() {
    const tag = document.getElementById("comp-tag").value.trim();
    const body = {
        compId: document.getElementById("comp-id").value.trim(),
        name: document.getElementById("comp-name").value.trim(),
        description: document.getElementById("comp-desc").value.trim()
    };
    if (tag === "" || body.compId === "") {
        showMessage("Fill in asset tag and component ID.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/components", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (res.ok) {
            showMessage("Component " + body.compId + " added to " + tag + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

async function removeComponent() {
    const tag = document.getElementById("comp-tag").value.trim();
    const compId = document.getElementById("comp-id").value.trim();
    if (tag === "" || compId === "") {
        showMessage("Fill in asset tag and component ID.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/components/" + encodeURIComponent(compId), {
            method: "DELETE"
        });
        if (res.ok) {
            showMessage("Component " + compId + " removed from " + tag + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// ---- Work orders ----
async function addWorkOrder() {
    const tag = document.getElementById("wo-tag").value.trim();
    const body = {
        orderId: document.getElementById("wo-id").value.trim(),
        status: "OPEN",
        description: document.getElementById("wo-desc").value.trim()
    };
    if (tag === "" || body.orderId === "") {
        showMessage("Fill in asset tag and work order ID.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/workorders", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (res.ok) {
            showMessage("Work order " + body.orderId + " opened on " + tag + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

async function updateWorkOrderStatus() {
    const tag = document.getElementById("wo-tag").value.trim();
    const orderId = document.getElementById("wo-status-id").value.trim();
    const status = document.getElementById("wo-status").value;
    if (tag === "" || orderId === "") {
        showMessage("Fill in asset tag and work order ID.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/workorders/" + encodeURIComponent(orderId), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(status)
        });
        if (res.ok) {
            showMessage("Work order " + orderId + " updated to " + status + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

async function addTask() {
    const tag = document.getElementById("wo-tag").value.trim();
    const orderId = document.getElementById("task-wo-id").value.trim();
    const body = {
        taskId: document.getElementById("task-id").value.trim(),
        description: document.getElementById("task-desc").value.trim()
    };
    if (tag === "" || orderId === "" || body.taskId === "") {
        showMessage("Fill in asset tag, work order ID and task ID.", true);
        return;
    }
    try {
        const res = await fetch(API + "/assets/" + encodeURIComponent(tag) + "/workorders/" + encodeURIComponent(orderId) + "/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (res.ok) {
            showMessage("Task " + body.taskId + " added to work order " + orderId + ".", false);
        } else {
            const err = await res.json();
            showMessage("Failed: " + err.message, true);
        }
    } catch (err) {
        showMessage("Request failed.", true);
    }
}

// load the global view as soon as the page opens
loadAllAssets();
</script>

</body>
</html>
